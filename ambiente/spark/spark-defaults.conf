# ============================================================================
#  Configuracao padrao do Spark (lida automaticamente pelo spark-submit).
#  Centraliza TUDO que e "infra" para que os scripts .py cuidem so da logica.
# ============================================================================

# Modo local: 1 unica JVM faz papel de driver e executor (leve, ideal p/ demo).
spark.master                                    local[*]

# JARs que ensinam o Spark a (1) falar Delta Lake e (2) ler do MySQL via JDBC.
spark.jars                                      /opt/jars/delta-spark_2.12-3.2.1.jar,/opt/jars/delta-storage-3.2.1.jar,/opt/jars/mysql-connector-j-8.4.0.jar

# Liga a sintaxe e o catalogo do Delta Lake.
spark.sql.extensions                            io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                 org.apache.spark.sql.delta.catalog.DeltaCatalog

# HDFS como sistema de arquivos padrao (onde as 3 camadas serao gravadas).
spark.hadoop.fs.defaultFS                       hdfs://namenode:9000
spark.hadoop.dfs.client.use.datanode.hostname   true

# Ajustes para pouca RAM.
spark.driver.memory                             1g
spark.sql.shuffle.partitions                    8
spark.ui.showConsoleProgress                    true
